<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noragentic – Kundeportal Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <img src="White Noragentic Logo.png" alt="NorAgentic logo" class="logo">

      <h1>Kundeportal</h1>
      <p class="auth-sub">
        Logg inn for å se prosjektet ditt
      </p>

      <form id="loginForm" class="auth-form">

        <label class="auth-field">
          <span>E-post</span>
          <input 
            id="email"
            type="email" 
            placeholder="kunde@firma.no"
            autocomplete="email"
            required 
          />
        </label>

        <label class="auth-field">
          <span>Passord</span>
          <input 
            id="password"
            type="password" 
            placeholder="••••••••"
            autocomplete="current-password"
            required 
          />
        </label>

        <button class="btn primary" type="submit">
          Logg inn
        </button>

        <p id="hint" class="auth-hint"></p>

      </form>

    </div>
  </main>

  <!-- Kun denne trengs -->
  <script type="module" src="customer-login.js"></script>

</body>
</html>
