<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noragentic – Kundeportal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg"></div>

  <header class="topbar">
    <div class="logo">N</div>

    <nav class="project-tabs">
      <button class="tab is-active" data-project="p1">Prosjekt 1</button>
      <button class="tab" data-project="p2">Prosjekt 2</button>
      <button class="tab" data-project="p3">Prosjekt 3</button>
    </nav>

    <button class="btn small" id="logoutBtn">Logg ut</button>
  </header>

  <main class="wrap">

    <section class="hero">
      <div class="card small">
        <div class="label">Valgt prosjekt</div>
        <div class="big" id="projectName">Prosjekt 1</div>
      </div>

      <div class="card wide">
        <div class="label">Prosjektstatus / delmål</div>
        <div class="big" id="projectGoal">Her vises aktivt delmål</div>

        <div class="placeholder-line">
          Statuskomponent kobles inn her senere
        </div>
      </div>
    </section>

    <section class="dashboard">

      <!-- VENSTRE -->
      <div class="left-column">

        <div class="panel card">
          <div class="section-title">Ukesstatus</div>
          <div class="placeholder-box">
            <strong>Placeholder</strong><br>
            Her kan ukentlig status vises
          </div>
        </div>
        <div class="panel card">
          <div class="section-title">Filer</div>

          <div id="fileManager" class="file-manager-shell">
            <div class="file-manager-topbar">
              <div id="breadcrumbBar" class="breadcrumb-bar"></div>
              <button id="uploadBtn" class="upload-btn" type="button">Last opp</button>
            </div>

            <input type="file" id="fileInput" hidden />
            <div id="contentsList" class="loading-state">Laster...</div>
          </div>
        </div>
      </div>

      <!-- HØYRE -->
      <div class="right-column">


        <div class="panel card">
          <div class="section-title">Prosjektbeskrivelse</div>
          <div class="editable-box" contenteditable="true" data-placeholder="Klikk her og skriv..."></div>
        </div>
        <div class="panel card">
          <div class="chat-box">

            <div id="chatMessages" class="chat-messages"></div>
          
            <form id="chatForm" class="chat-input">
              <input id="chatInput" type="text" placeholder="Skriv melding..." />
              <button type="submit" class="btn">Send</button>
            </form>
          
            <button id="testBtn" class="btn small">Test DB</button>
          
          </div>
        </section>

  </main>
  <script type="module" src="chat.js"></script>
  <script type="module" src="script.js"></script>
  <script type="module" src="file-manager.js"></script>
</body>
</html>
